name: Daily collect

on:
  schedule:
    # 06:00 Asia/Saigon (UTC+7) = 23:00 UTC. Writes a report only; never pushes main.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: armory-data-branch
  cancel-in-progress: false

jobs:
  collect:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Select weekly branch
        id: week
        run: |
          branch="weekly/$(date -u +%G-W%V)"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          git fetch origin
          if git rev-parse --verify "origin/${branch}" >/dev/null 2>&1; then
            git checkout -B "$branch" "origin/${branch}"
          else
            git checkout -B "$branch" "origin/main"
          fi
      - name: Collect daily report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/collect.py --mode daily --report daily-report.json
      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-report
          path: daily-report.json
          retention-days: 30
      - name: Publish report on the weekly branch
        run: bash scripts/push_weekly.sh "${{ steps.week.outputs.branch }}" "Daily collect" daily-report.json
